name: Daily Forecast

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repo (this repo)
        uses: actions/checkout@v4

      - name: Checkout code repo
        uses: actions/checkout@v4
        with:
          repository: ziamusti/Grid-Forecaster
          path: code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-stage0.txt
        working-directory: code

      - name: Set forecast start (tomorrow, UTC)
        # The job runs at 23:00 UTC, so "today" in UTC is almost over; forecast
        # the next three full days instead.
        run: |
          echo "TARGET_DATE=$(date -u -d '+1 day' +%F)" >> "$GITHUB_ENV"
          echo "TARGET_TAG=$(date -u -d '+1 day' +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Download weather forecast
        run: python scripts/download_weather_forecast_range.py --target-start "${TARGET_DATE}" --days 3
        working-directory: code

      - name: Download SMARD data
        run: python scripts/download_smard_range.py --start "$(date -u -d '10 days ago' +%F)" --end-exclusive "$(date -u +%F)"
        working-directory: code

      - name: Download price data
        run: python scripts/download_energycharts_price_range.py --start "$(date -u -d '10 days ago' +%F)" --end-exclusive "$(date -u -d '+4 days' +%F)"
        working-directory: code

      - name: Predict CO2
        run: python scripts/predict_price_forecast.py --target-start "${TARGET_DATE}" --days 3 --weather-dir "data/raw/weather_forecast_${TARGET_TAG}_3d"
        working-directory: code

      - name: Predict renewable share
        run: python scripts/predict_renewable_forecast.py --forecast-dir "reports/forecast_price_${TARGET_TAG}_3d_v1"
        working-directory: code

      - name: Predict main model (XGBoost, CO2 selbst berechnet, Gruenanteil nach Quellen)
        run: python scripts/predict_xgb_forecast.py --forecast-dir "reports/forecast_price_${TARGET_TAG}_3d_v1"
        working-directory: code

      - name: Predict Bundesland forecast (CO2 + Gruenanteil, gepoolt)
        run: python scripts/predict_bundesland_forecast.py --target-start "${TARGET_DATE}" --days 3 --weather-dir "data/raw/weather_forecast_${TARGET_TAG}_3d"
        working-directory: code

      - name: Download Energy-Charts generation per Bundesland
        run: python scripts/download_energycharts_bundesland.py --start-year "$(date -u -d '-21 days' +%Y)"
        working-directory: code

      - name: Predict Bundesland main model (XGBoost, Quellen je Land)
        run: python scripts/predict_bundesland_xgb_forecast.py --bundesland-dir "reports/forecast_bundesland_${TARGET_TAG}_3d_v1" --national-dir "reports/forecast_price_${TARGET_TAG}_3d_v1"
        working-directory: code

      - name: Copy predictions into data repo
        run: |
          cp "code/reports/forecast_price_${TARGET_TAG}_3d_v1/predictions.csv" predictions.csv
          cp "code/reports/forecast_bundesland_${TARGET_TAG}_3d_v1/predictions.csv" predictions_bundesland.csv

      - name: Append to prediction history (keeps earlier forecast days)
        run: |
          python code/scripts/append_live_history.py --new predictions.csv --history predictions_history.csv
          python code/scripts/append_live_history.py --new predictions_bundesland.csv --history predictions_bundesland_history.csv

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions.csv predictions_bundesland.csv predictions_history.csv predictions_bundesland_history.csv
          git commit -m "Automatische Vorhersage $(date -u +%F)" || echo "Keine Aenderungen"
          git push
